name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the APK as a Release

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.24.5
          cache: true

      - name: Generate Android project files
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.potens --project-name taskflow .
          fi

      - name: Set app name and icon
        run: bash tool/setup_android.sh

      # Same signing key on every build, so a new APK installs as an UPDATE
      # over the old one (data is kept). Test-only key, not for Play Store.
      - name: Use fixed signing key
        run: |
          mkdir -p ~/.android
          cp tool/debug.keystore ~/.android/debug.keystore

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib

      - name: Build APK
        run: |
          flutter build apk --release --build-number=${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-release.apk TaskFlow.apk

      - name: Upload APK (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: TaskFlow-APK
          path: TaskFlow.apk

      - name: Publish as latest Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: TaskFlow build ${{ github.run_number }}
          body: "Commit: ${{ github.sha }}"
          files: TaskFlow.apk
          make_latest: true

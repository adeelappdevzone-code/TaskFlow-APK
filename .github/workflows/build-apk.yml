name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # publish the APK as a Release + save CI log branch

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash   # bash with -e -o pipefail, so "| tee" keeps failures
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Fixed Flutter version so a new Flutter release can't break the
          # build on its own. To upgrade: change this number and push.
          flutter-version: 3.47.7
          cache: true

      - name: Flutter version
        run: flutter --version 2>&1 | tee -a ci.log

      - name: Generate Android project files
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.potens --project-name taskflow . 2>&1 | tee -a ci.log
          fi

      - name: Set app name, icon, minSdk
        run: bash tool/setup_android.sh 2>&1 | tee -a ci.log

      # Same signing key on every build, so a new APK installs as an UPDATE
      # over the old one (data is kept). Test-only key, not for Play Store.
      - name: Use fixed signing key
        run: |
          mkdir -p ~/.android
          cp tool/debug.keystore ~/.android/debug.keystore

      - name: Get packages
        run: flutter pub get 2>&1 | tee -a ci.log

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib test 2>&1 | tee -a ci.log

      - name: Unit tests
        run: flutter test 2>&1 | tee -a ci.log

      # Checks firestore.rules against the app's real writes (Firestore emulator).
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Firestore rules tests
        working-directory: tool/rules_test
        run: |
          npm ci 2>&1 | tail -3 | tee -a ../../ci.log
          npm test 2>&1 | grep -vE "^\[.*GrpcConnection" | tee -a ../../ci.log

      - name: Build APK
        run: |
          # One APK per phone type is much smaller than one APK for all.
          # TaskFlow.apk = arm64 (almost every phone from the last ~8 years),
          # TaskFlow-old-phones.apk = 32-bit arm, for very old phones.
          flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64 \
            --build-number=${{ github.run_number }} 2>&1 | tee -a ci.log
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk TaskFlow.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk TaskFlow-old-phones.apk
          ls -lh TaskFlow*.apk | tee -a ci.log

      # The SHA-1 added in Firebase must match the APK's key, otherwise Google
      # login fails with "[16] Account reauth failed".
      - name: Check APK signing key
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for apk in TaskFlow.apk TaskFlow-old-phones.apk; do
            "$APKSIGNER" verify --print-certs "$apk" 2>&1 | tee -a ci.log
            "$APKSIGNER" verify --print-certs "$apk" | grep -qi "SHA-1 digest: 2e55ddaf09a30d937e752b06c1800467fe817f59" \
              || { echo "$apk is NOT signed with tool/debug.keystore" | tee -a ci.log; exit 1; }
          done

      - name: Upload APK (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: TaskFlow-APK
          path: TaskFlow*.apk

      - name: Publish as latest Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: TaskFlow build ${{ github.run_number }}
          body: "Commit: ${{ github.sha }}"
          files: |
            TaskFlow.apk
            TaskFlow-old-phones.apk
          make_latest: true

      # Keep only the newest 5 builds (older releases and their tags are deleted).
      - name: Delete old releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --repo "${{ github.repository }}" --limit 1000 \
              --json tagName,createdAt --jq 'sort_by(.createdAt) | reverse | .[5:] | .[].tagName' \
            | grep '^build-' \
            | while read -r tag; do
                echo "Deleting old release $tag"
                gh release delete "$tag" --repo "${{ github.repository }}" --yes --cleanup-tag
              done || true

      # Saves the log + result to the "ci-logs" branch so problems can be
      # read and fixed without screenshots.
      - name: Save CI log
        if: always()
        env:
          STATUS: ${{ job.status }}
        run: |
          mkdir -p /tmp/ci
          cp ci.log /tmp/ci/build.log 2>/dev/null || echo "no log" > /tmp/ci/build.log
          echo "run=${{ github.run_number }} status=$STATUS commit=${{ github.sha }}" > /tmp/ci/status.txt
          cd /tmp/ci
          git init -q
          git checkout -q -b ci-logs
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add .
          git commit -qm "CI run ${{ github.run_number }}: $STATUS"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-logs

  # Web version on Firebase Hosting (https://taskflow-ce905.web.app) and the
  # Firestore rules. Runs after the APK job (so all tests have passed).
  # Needs the FIREBASE_SERVICE_ACCOUNT secret (service-account JSON key);
  # without it the web app is only built, not deployed.
  web:
    needs: build
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    env:
      HAS_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Build web app
        run: |
          flutter create --platforms=web --org com.potens --project-name taskflow . 2>&1 | tee -a web.log
          bash tool/setup_web.sh 2>&1 | tee -a web.log
          flutter pub get 2>&1 | tee -a web.log
          flutter build web --release 2>&1 | tee -a web.log

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Publish Firestore rules
        if: env.HAS_SA == 'true'
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx -y firebase-tools@14.27.0 deploy --only firestore:rules \
            --project taskflow-ce905 --non-interactive 2>&1 | tee -a web.log

      - name: Deploy web app
        if: env.HAS_SA == 'true'
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if ! grep -q "webAppId = '1:" lib/firebase_options.dart; then
            echo "Web app id not set in lib/firebase_options.dart yet: skipping deploy." | tee -a web.log
            exit 0
          fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx -y firebase-tools@14.27.0 deploy --only hosting \
            --project taskflow-ce905 --non-interactive 2>&1 | tee -a web.log

      - name: No deploy key
        if: env.HAS_SA != 'true'
        run: |
          echo "FIREBASE_SERVICE_ACCOUNT secret is not set - web app built but not deployed." | tee -a web.log

      - name: Save web log
        if: always()
        env:
          STATUS: ${{ job.status }}
        run: |
          mkdir -p /tmp/ci
          cp web.log /tmp/ci/web.log 2>/dev/null || echo "no log" > /tmp/ci/web.log
          echo "run=${{ github.run_number }} status=$STATUS commit=${{ github.sha }}" > /tmp/ci/status.txt
          cd /tmp/ci
          git init -q
          git checkout -q -b ci-logs-web
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add .
          git commit -qm "Web run ${{ github.run_number }}: $STATUS"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-logs-web

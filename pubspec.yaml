name: taskflow
description: TaskFlow - task management app (Firebase Auth + Cloud Firestore, works offline).
publish_to: 'none'
version: 1.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  uuid: ^4.4.0
  intl: '>=0.19.0 <0.21.0'
  shared_preferences: ^2.2.3
  # Firebase: minor updates allowed, a new major version is not picked up
  # automatically (it could break the build). Versions last built in CI.
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  google_sign_in: ^7.0.0
  # Phone reminders that also work when the app is closed
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2
  # Share the weekly report (image / text) to WhatsApp etc.
  share_plus: ^13.3.1
  # Open task links (Google Drive, Docs, websites)
  url_launcher: ^6.3.3
  pdf: ^3.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

name: taskflow
description: TaskFlow - task management app (Firebase Auth + Cloud Firestore, works offline).
publish_to: 'none'
version: 1.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  uuid: ^4.4.0
  intl: '>=0.19.0 <0.21.0'
  shared_preferences: ^2.2.3
  # Firebase (pub picks the newest versions that fit the Flutter version in CI)
  firebase_core: '>=3.0.0 <100.0.0'
  firebase_auth: '>=5.0.0 <100.0.0'
  cloud_firestore: '>=5.0.0 <100.0.0'
  google_sign_in: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
